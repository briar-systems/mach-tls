name: CI

on:
  pull_request:
    branches: [dev, main]
  # release branches also build on push. a pull_request trigger is selected from
  # the base branch, so adding `main` above cannot take effect for the very PR
  # that adds it -- the first release PR would still land untested.
  push:
    branches:
      - 'chore/release-*'
      - 'hotfix/*'

jobs:
  linux-x86_64:
    name: linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Seed mach
        uses: ./.github/actions/seed-mach

      - name: Report the seed
        run: mach info

      # gnutls-cli and gnutls-serv are half of the interoperability matrix.
      # openssl and ss are already on the runner image.
      - name: Install the external TLS implementations
        run: |
          sudo apt-get update
          sudo apt-get install -y gnutls-bin

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          mach dep pull .
          mach dep pull test/transport
          mach dep pull test/interop

      - name: Build
        run: mach build .

      - name: Test
        run: mach test .

      - name: Test (release)
        run: mach test . --profile release

      - name: Test the transport project
        run: mach test test/transport

      - name: Build the interoperability harness
        run: mach build test/interop

      # the complete client and server matrix against OpenSSL and GnuTLS. every
      # leg is an assertion and the script exits non-zero naming any that failed.
      - name: Run the interoperability matrix
        run: test/interop/run.sh

      - name: Verify IR across every target
        run: mach build . --all-targets --verify-ir --profile release
