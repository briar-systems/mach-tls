name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      heavy:
        type: string
        default: none
  workflow_dispatch:
    inputs:
      heavy:
        description: heavy work to run on this ref
        type: choice
        default: none
        options: [none, all, aarch64-linux, x86_64-windows, aarch64-darwin, x86_64-darwin]

permissions:
  contents: read

jobs:
  lib:
    uses: briar-systems/.github/.github/workflows/mach-lib.yml@main
    with:
      heavy: ${{ inputs.heavy }}
      # tls needs mach 5.12, so it seeds v5.12.0 until the family pin moves (briar-systems/.github#103)
      mach-version: v5.12.0
      # mach tests only the selected artifact's closure, so the test modules run
      # through the tests artifact, and .github/ci/verify.sh fails when it misses one
      test-selections: '[["--lib", "tests"]]'
      # crypto 0.17 and later link a DIT-required aarch64 start, so a runner
      # without FEAT_DIT runs the tests under qemu-aarch64 -cpu max
      dit: required
      # the interop harness is built here and run by .github/ci/verify.sh
      subprojects: '[{"path": "test/interop", "build": true, "test": false, "legs": ["x86_64-linux"]}]'

  gate:
    if: always()
    needs: [lib]
    runs-on: ubuntu-latest
    steps:
      - uses: briar-systems/.github/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
