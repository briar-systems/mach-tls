[project]
id = "tls"
version = "0.12.0"
mach = "^5.12"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64d"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

# the library, and the only artifact `mach build .` and `--all-targets` select
[artifact.tls]
kind = "static"
default = true
entry = "lib/tls.mach"
out = "lib/tls"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
version = "^8.0"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
version = "^0.22"

# test-only: the library and every test module, run with `mach test . --lib tests`
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "lib/tests"
targets = ["*"]
link = []
need = []
