[project]
id = "tls"
version = "0.17.0"
mach = "^7"
src = "src"
work = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
arch = "x86_64"
sys = "linux"
abi = "sysv64"

[target.linux-arm64]
arch = "aarch64"
sys = "linux"
abi = "aapcs64"

[target.linux-riscv64]
arch = "riscv64"
sys = "linux"
abi = "lp64d"

[target.windows-x86_64]
arch = "x86_64"
sys = "windows"
abi = "win64"

[target.darwin-x86_64]
arch = "x86_64"
sys = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
arch = "aarch64"
sys = "darwin"
abi = "darwinpcs"

[profile.debug]
default = true
optimize = false
debug = false
simd = "scalarize"

[profile.release]
optimize = true
debug = false
simd = "scalarize"

# the library, and the only artifact `mach build .` selects
[artifact.tls]
kind = "static"
default = true
export = true
entry = "lib/tls.mach"
out = "{project.work}/lib/libtls{artifact.suffix}"
targets = ["*"]
link = []
need = []

[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "branch/dev"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "branch/dev"

[dep.pki]
git = "https://github.com/briar-systems/mach-pki"
ref = "branch/dev"

# test-only: the library and every test module, run with `mach test . -a tests`
[artifact.tests]
kind = "static"
entry = "lib/tests.mach"
out = "{project.work}/lib/libtests{artifact.suffix}"
targets = ["*"]
link = []
need = []
