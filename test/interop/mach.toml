[project]
id = "tls-client-interop"
version = "0.0.0"
mach = "^5.9"
src = "src"
out = "out/{target.name}/{profile.name}"

[target.linux-x86_64]
default = true
isa = "x86_64"
os = "linux"
abi = "sysv64"

[target.linux-arm64]
isa = "aarch64"
os = "linux"
abi = "aapcs64"

[target.linux-riscv64]
isa = "riscv64"
os = "linux"
abi = "lp64d"

[target.windows-x86_64]
isa = "x86_64"
os = "windows"
abi = "win64"

[target.darwin-x86_64]
isa = "x86_64"
os = "darwin"
abi = "sysv64"

[target.darwin-aarch64]
isa = "aarch64"
os = "darwin"
abi = "aapcs64"

[profile.debug]
default = true
opt = 0
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[profile.release]
opt = 2
debug = false
simd = "scalarize"
vectorize = true
float_reassoc = false

[artifact.tls-client-interop]
kind = "bin"
entry = "main.mach"
out = "bin/tls-client-interop"
targets = ["*"]
link = []
need = []

[artifact.tls-server-interop]
kind = "bin"
entry = "server_main.mach"
out = "bin/tls-server-interop"
targets = ["*"]
link = []
need = []

[artifact.tls-evidence]
kind = "bin"
entry = "evidence_main.mach"
out = "bin/tls-evidence"
targets = ["*"]
link = []
need = []

[dep.tls]
path = "../.."

# std and crypto are pinned here because a path dependency carries no pin for
# a dependency it selects by version, and this tree is not committed
[dep.std]
git = "https://github.com/briar-systems/mach-std"
ref = "tag/v7.0.2"

[dep.crypto]
git = "https://github.com/briar-systems/mach-crypto"
ref = "tag/v0.20.0"
